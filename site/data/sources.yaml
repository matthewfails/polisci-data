# ─────────────────────────────────────────────────────────────────────────────
# DATA SOURCES — the only file you need to edit to add, change, or remove a source.
#
# To ADD a source: copy the TEMPLATE block below, paste it anywhere in the list
# (order doesn't matter; the site sorts alphabetically), and fill it in.
# To REMOVE a source: delete its whole block (from "- name:" to the next "- name:").
#
# TEMPLATE
# - name: Full name of the dataset
#   abbr: SHORT             # optional abbreviation students might search for
#   url: https://...        # main link (the data or its landing page)
#   description: "One or two plain-language sentences on what it measures."
#   topics: [us-elections]  # one or more slugs from data/topics.yaml
#   units: [people]         # people, countries, states, events, elections, officials, policies, portal
#   access: free            # free, registration, library, browse
#   coverage: "United States, 1948–present"   # optional: where and when
#   keywords: [turnout, vote choice]          # words a student might type
#   links:                  # optional extra links
#     - { label: Codebook, url: "https://..." }
#   note: "Optional tip shown in small print."
#
# Tips: wrap any text containing a colon (:) in "double quotes".
# Keep keywords lowercase. Indentation must use spaces, not tabs.
# ─────────────────────────────────────────────────────────────────────────────

# ═══ U.S. ELECTIONS & CAMPAIGNS ═══

- name: American National Election Studies
  abbr: ANES
  url: https://electionstudies.org/
  description: "The longest-running academic survey of American voters: turnout, vote choice, party identification, political knowledge, and attitudes in every presidential and many midterm elections."
  topics: [us-elections, us-opinion]
  units: [people]
  access: registration
  coverage: "United States, 1948–present"
  keywords: [voting, turnout, vote choice, party identification, partisanship, ideology, feeling thermometer, political knowledge, trust in government, polarization, panel survey]

- name: Cooperative Election Study
  abbr: CES / CCES
  url: https://cces.gov.harvard.edu/
  description: "Very large (50,000+ respondents) online survey run by YouGov each fall. A pre-election wave covers attitudes, demographics, and vote intentions; a post-election wave covers how people voted. Large enough to study individual states and congressional districts."
  topics: [us-elections, us-opinion]
  units: [people]
  access: free
  coverage: "United States, 2006–present"
  keywords: [voting, turnout, vote choice, roll call votes, congressional district, party identification, ideology, validated vote, policy preferences, cooperative congressional election study]
  note: "Formerly called the Cooperative Congressional Election Study (CCES)."

- name: National Annenberg Election Survey
  abbr: NAES
  url: https://www.annenbergpublicpolicycenter.org/political-communication/naes/
  description: "Rolling cross-section surveys tracking attitudes about candidates, issues, media exposure, and the traits Americans want in a president during campaigns."
  topics: [us-elections, us-opinion]
  units: [people]
  access: free
  coverage: "United States, presidential campaigns 2000, 2004, 2008"
  keywords: [campaign, media exposure, candidate traits, debates, advertising, rolling cross-section]

- name: MIT Election Data and Science Lab
  abbr: MEDSL
  url: https://electionlab.mit.edu/data
  description: "Clean, downloadable U.S. election returns at the state, county, and precinct level for presidential, Senate, House, and state offices."
  topics: [us-elections, us-states]
  units: [elections, states]
  access: free
  coverage: "United States, 1976–present (varies by office)"
  keywords: [election results, vote share, county returns, precinct returns, house elections, senate elections, presidential elections, turnout, election administration]

- name: CQ Voting and Elections Collection
  url: https://oakland.libguides.com/az/databases
  description: "Reference articles plus election results that can be filtered by candidate, office, locality, and race type over time."
  topics: [us-elections]
  units: [elections]
  access: library
  coverage: "United States, historical to present"
  keywords: [election results, primaries, parties, campaigns, governors, house elections, senate elections]
  note: "Subscription database. Search for it by name in the OU Libraries A–Z database list."

- name: Polling the Nations
  url: https://oakland.libguides.com/az/databases
  description: "Searchable question-by-question results (percentages) from public opinion polls in the U.S. and about 100 other countries."
  topics: [us-opinion, world-opinion]
  units: [people]
  access: library
  coverage: "United States and ~100 countries, 1986–present"
  keywords: [poll results, question wording, topline, public opinion trends]
  note: "Subscription database. Search for it by name in the OU Libraries A–Z database list. Gives percentages, not respondent-level data."

- name: The American Presidency Project
  url: https://www.presidency.ucsb.edu/statistics
  description: "Data on the presidency: presidential approval, relations with Congress, vetoes, executive orders, public appearances, addresses, and presidential elections, plus a searchable archive of presidential documents."
  topics: [us-congress, us-elections]
  units: [officials]
  access: free
  coverage: "United States, 1789–present"
  keywords: [presidential approval, executive orders, vetoes, speeches, state of the union, signing statements, presidential elections, electoral college]

- name: PollingReport
  url: https://www.pollingreport.com/
  description: "Compiles recent results from major national polls on elections, the president, and policy issues."
  topics: [us-opinion, us-elections]
  units: [people]
  access: browse
  coverage: "United States, recent years"
  keywords: [poll results, presidential approval, issue polls, horse race]

- name: SDA (Survey Documentation and Analysis) at Berkeley
  abbr: SDA
  url: https://sda.berkeley.edu/
  description: "Run tables and pull custom extracts from the ANES, General Social Survey, and other public opinion studies right in the browser — no statistical software needed."
  topics: [us-opinion, us-elections]
  units: [people]
  access: free
  coverage: "United States"
  keywords: [crosstabs, online analysis, gss, anes, extract, beginner friendly]

- name: Database on Ideology, Money in Politics, and Elections
  abbr: DIME
  url: https://data.stanford.edu/dime
  description: "Campaign contribution records, candidate characteristics, election outcomes, and ideology scores (CFscores) for candidates, donors, and organizations at the federal and state levels."
  topics: [us-elections, us-congress, us-states]
  units: [officials, people]
  access: free
  coverage: "United States, 1979–present"
  keywords: [campaign finance, donations, contributions, cfscores, ideology, pacs, interest groups, state legislators, candidates]

- name: International IDEA Data Tools
  abbr: IDEA
  url: https://www.idea.int/data-tools
  description: "Cross-national data on electoral rules, how elections are run, voter turnout, gender quotas, political finance rules, and direct democracy."
  topics: [institutions, parties]
  units: [countries, elections]
  access: free
  coverage: "Worldwide, 1945–present"
  keywords: [voter turnout, electoral system, gender quotas, compulsory voting, political finance, referendums, direct democracy, women in parliament]
  links:
    - { label: Voter Turnout Database, url: "https://www.idea.int/data-tools/data/voter-turnout-database" }

